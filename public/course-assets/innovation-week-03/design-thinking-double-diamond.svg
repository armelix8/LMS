<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" fill="none" role="img" aria-labelledby="t d"><title id="t">Double diamond design process</title><desc id="d">Discover define develop deliver phases in diverge-converge pattern.</desc><rect width="640" height="220" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Design thinking  double diamond (simplified)</text><path d="M40 120 Q120 40 200 120 Q280 200 360 120 Q440 40 520 120 Q560 160 600 120" stroke="#0d9488" stroke-width="3" fill="none"/><text x="120" y="105" fill="#115e59" font-family="system-ui,sans-serif" font-size="10" font-weight="600">Discover</text><text x="280" y="105" fill="#0369a1" font-family="system-ui,sans-serif" font-size="10" font-weight="600">Define</text><text x="400" y="105" fill="#7c3aed" font-family="system-ui,sans-serif" font-size="10" font-weight="600">Develop</text><text x="540" y="105" fill="#c2410c" font-family="system-ui,sans-serif" font-size="10" font-weight="600">Deliver</text><text x="320" y="195" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">Diverge (explore) and converge (decide) at each transition  adapt to your teams process.</text></svg>
