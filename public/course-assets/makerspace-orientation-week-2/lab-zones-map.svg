<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" aria-labelledby="title desc" role="img">
  <title id="title">Conceptual UNIPOD lab zones</title>
  <desc id="desc">Floor-style map with intake, digital fabrication, bench work, electronics, and storage areas.</desc>
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="16" y="16" width="608" height="328" rx="12" stroke="#0f766e" stroke-width="2" fill="#ecfdf5"/>
  <text x="320" y="44" text-anchor="middle" fill="#134e4a" font-family="system-ui,sans-serif" font-size="14" font-weight="700">UNIPOD lab  conceptual zones</text>
  <rect x="40" y="64" width="140" height="100" rx="8" fill="#fff" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="110" y="100" text-anchor="middle" fill="#115e59" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Intake &amp;</text>
  <text x="110" y="118" text-anchor="middle" fill="#115e59" font-family="system-ui,sans-serif" font-size="11" font-weight="600">induction</text>
  <rect x="200" y="64" width="200" height="100" rx="8" fill="#fff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="300" y="100" text-anchor="middle" fill="#0c4a6e" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Digital fabrication</text>
  <text x="300" y="118" text-anchor="middle" fill="#0369a1" font-family="system-ui,sans-serif" font-size="10">3D print � laser � CNC prep</text>
  <rect x="420" y="64" width="180" height="100" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="510" y="100" text-anchor="middle" fill="#312e81" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Bench &amp; hand tools</text>
  <rect x="40" y="188" width="280" height="120" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="180" y="230" text-anchor="middle" fill="#92400e" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Electronics &amp; soldering</text>
  <text x="180" y="250" text-anchor="middle" fill="#b45309" font-family="system-ui,sans-serif" font-size="10">ESD-aware � fume if applicable</text>
  <rect x="340" y="188" width="260" height="120" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="470" y="240" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Materials &amp; storage</text>
  <text x="470" y="258" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">Actual layout may differ  follow on-site signage</text>
</svg>
